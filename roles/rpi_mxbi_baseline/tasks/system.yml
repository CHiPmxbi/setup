---
- name: Update the APT cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - update

- name: Upgrade system packages
  become: true
  ansible.builtin.apt:
    upgrade: safe
  tags:
    - update

- name: Install system dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ rpi_mxbi_baseline_apt_packages }}"
    state: present
